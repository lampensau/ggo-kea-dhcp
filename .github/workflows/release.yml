name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: the release-scope derivation below diffs the
          # packaging inputs against the previous tag.
          fetch-depth: 0

      - name: Verify tag matches version.go
        run: |
          VER="${GITHUB_REF_NAME#v}"
          CODE=$(sed -n 's/.*Number = "\(.*\)".*/\1/p' internal/version/version.go)
          if [ "$VER" != "$CODE" ]; then
            echo "Tag $GITHUB_REF_NAME (=$VER) does not match version.go Number ($CODE)"
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install templ + nfpm
        # Both pinned so re-tagging reproduces the same .deb (an @latest nfpm could
        # change package layout between two builds of the same tag).
        run: |
          go install github.com/a-h/templ/cmd/templ@v0.3.1020
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0

      - name: Generate templ components
        run: templ generate

      # Fail the release build closed on a known-vulnerable dependency. ci.yml runs
      # this on the main-branch push, but a tag pushed by hand (not via `make
      # release`) would otherwise publish a .deb without ever hitting that gate.
      # Pinned to match ci.yml and the Makefile.
      - name: Vulnerability scan (govulncheck, pinned)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          govulncheck ./...

      - name: Cross-compile (Raspberry Pi arm64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -mod=vendor -ldflags="-s -w" -o ggo-kea-dhcp-arm64 .

      - name: Build .deb
        run: |
          VER="${GITHUB_REF_NAME#v}"            # strip the leading v for a valid Debian version
          mkdir -p dist                         # nfpm --target dist/ errors "is a directory" if dist/ is absent
          GGO_VERSION="$VER" nfpm package --packager deb --config packaging/nfpm.yaml --target dist/
          # Stable asset name so install.sh can fetch .../releases/latest/download/ggo-kea-dhcp_arm64.deb
          cp dist/ggo-kea-dhcp_*_arm64.deb dist/ggo-kea-dhcp_arm64.deb
          ls -l dist/

      - name: Write the release.json manifest (app vs system scope)
        # The appliance's self-updater reads this to message the install
        # honestly: "app" installs the .deb with dependencies frozen; "system"
        # (this release changed the dependency set) runs the broader apt path.
        # Derived from whether the packaging inputs changed since the previous
        # tag; an explicit "release-scope: app|system" line in the tag message
        # overrides the derivation. Asset checksums need no step here - the
        # GitHub API publishes a digest per asset, which install.sh and the
        # appliance both verify against.
        run: |
          VER="${GITHUB_REF_NAME#v}"
          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          scope=app
          if [ -z "$prev" ]; then
            scope=system   # first release: nothing to diff against, take the safe path
          elif [ -n "$(git diff --name-only "$prev" "$GITHUB_REF_NAME" -- packaging/nfpm.yaml packaging/apt/)" ]; then
            scope=system
          fi
          override="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed -n 's/^release-scope:[[:space:]]*//p' | head -n1)"
          case "$override" in
            app|system) scope="$override" ;;
          esac
          printf '{"schema":1,"version":"%s","scope":"%s"}\n' "$VER" "$scope" > dist/release.json
          cat dist/release.json

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/ggo-kea-dhcp_arm64.deb \
            dist/release.json \
            ggo-kea-dhcp-arm64 \
            --generate-notes
