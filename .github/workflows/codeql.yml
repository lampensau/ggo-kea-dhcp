name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 18 * * 6' # Weekly on Saturdays at 18:30 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go', 'actions' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Initialize the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: ${{ matrix.language }}
          # security-and-quality is a superset of security-extended
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      # Custom build steps to handle code generation (templ) and Go vendoring.
      # The 'actions' language is buildless - these only apply to Go.
      - name: Install templ (pinned to go.mod)
        if: matrix.language == 'go'
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: Generate templ components
        if: matrix.language == 'go'
        run: templ generate

      - name: Build codebase (vendored)
        if: matrix.language == 'go'
        run: go build -mod=vendor ./...

      # Perform the CodeQL analysis and upload findings to GitHub Security tab
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "/language:${{matrix.language}}"
