name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 18 * * 6' # Weekly on Saturdays at 18:30 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go', 'actions' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # Initialize the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          languages: ${{ matrix.language }}
          # security-and-quality is a superset of security-extended
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      # Custom build steps to handle code generation (templ) and Go vendoring.
      # The 'actions' language is buildless - these only apply to Go.
      - name: Install templ (pinned to go.mod)
        if: matrix.language == 'go'
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: Generate templ components
        if: matrix.language == 'go'
        run: templ generate

      - name: Build codebase (vendored)
        if: matrix.language == 'go'
        run: go build -mod=vendor ./...

      # Perform the CodeQL analysis and upload findings to GitHub Security tab
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          category: "/language:${{matrix.language}}"
