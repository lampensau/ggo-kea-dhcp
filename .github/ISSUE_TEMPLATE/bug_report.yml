name: Bug report
description: File a bug report to help us improve
title: "[BUG] "
labels: ["bug"]
assignees: ["lampensau"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible to help us diagnose and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: What should have happened...
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device
      description: What hardware device is the appliance running on?
      options:
        - Raspberry Pi 4
        - Raspberry Pi 5
        - Raspberry Pi 3
        - Virtual Machine / Dev Environment
        - Other (please specify in context)
    validations:
      required: true

  - type: input
    id: os-distro
    attributes:
      label: OS / Distribution
      description: Which operating system and version is running on the device?
      placeholder: e.g. Raspberry Pi OS 12 (Bookworm)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ggo-kea-dhcp Version
      description: The version of ggo-kea-dhcp you are running.
      placeholder: e.g. v1.1.2
    validations:
      required: true

  - type: textarea
    id: logs-screenshots
    attributes:
      label: Logs & Screenshots
      description: |
        If applicable, add screenshots, UI video recordings, or CLI logs to help explain your problem.
        You can retrieve service logs with: `journalctl -u ggo-kea-dhcp`
      placeholder: Paste logs or drag images here...
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.
      placeholder: Any other relevant details...
    validations:
      required: false
